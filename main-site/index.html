    <!-- ───── HERO ───── -->
    <section class="hero">
        <h1 class="hero-title">Singaporean Chinese Dictionary</h1>
        <p class="hero-sub">Search local Chinese terms by Hanyu Pinyin, Chinese characters, or English translation.</p>
    </section>

    <!-- ───── SEARCH + SORT ───── -->
    <main class="main-container">
        <div class="search-row glass-card">
            <div class="search-wrap">
                <span class="search-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
                        <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                </span>
                <input type="search" id="searchInput" class="search-input"
                    placeholder="Search by Hanyu Pinyin, 汉字, or English…" autocomplete="off"
                    aria-label="Search dictionary" />
                <button class="btn-clear" id="clearBtn" aria-label="Clear search" hidden>
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="18" height="18">
                        <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                        <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                </button>
            </div>

            <div class="sort-wrap">
                <label for="sortSelect" class="sort-label">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                        aria-hidden="true">
                        <path d="M3 6h18M7 12h10M11 18h2" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                    Sort
                </label>
                <select id="sortSelect" class="sort-select" aria-label="Sort order">
                    <option value="hypy_asc">Pinyin A → Z</option>
                    <option value="hypy_desc">Pinyin Z → A</option>
                    <option value="en_asc">English A → Z</option>
                    <option value="en_desc">English Z → A</option>
                </select>
            </div>
        </div>

        <!-- Status bar -->
        <div class="status-bar" id="statusBar" aria-live="polite" aria-atomic="true"></div>

        <!-- Results -->
        <div class="results-grid" id="resultsGrid" role="list" aria-label="Dictionary results"></div>

        <!-- Pagination -->
        <div class="pagination-wrap" id="paginationWrap" hidden>
            <button class="btn-page" id="prevBtn" aria-label="Previous page">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                    aria-hidden="true">
                    <polyline points="15 18 9 12 15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                Prev
            </button>
            <span class="page-indicator" id="pageIndicator">Page 1 of 1</span>
            <button class="btn-page" id="nextBtn" aria-label="Next page">
                Next
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                    aria-hidden="true">
                    <polyline points="9 18 15 12 9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>
        </div>

        <!-- Empty state -->
        <div class="empty-state" id="emptyState" hidden aria-live="polite">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="64" height="64"

                <circle cx="28" cy="28" r="20" stroke="currentColor" stroke-width="3" opacity="0.4" />
                <line x1="42" y1="42" x2="56" y2="56" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                    opacity="0.4" />
                <line x1="20" y1="28" x2="36" y2="28" stroke="currentColor" stroke-width="3" stroke-linecap="round"

                <line x1="28" y1="20" x2="28" y2="36" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                    opacity="0.4" />
            </svg>
            <p class="empty-title">No results found</p>
            <p class="empty-sub" id="emptySubText"></p>
        </div>

        <!-- Loader -->
        <div class="loader-wrap" id="loaderWrap" hidden aria-label="Loading" aria-live="polite">
            <div class="loader"></div>
        </div>

                        <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2"

            <div class="theme-grid">
